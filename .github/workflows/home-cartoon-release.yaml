name: Home Cartoon / Release APK

on:
  push:
    branches:
      - master
    paths-ignore:
      - telemovel/**
      - .github/workflows/home-cartoon-telemovel.yaml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home-cartoon-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    env:
      JELLYFIN_VERSION: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version-file: .tools-versions
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret KEYSTORE_BASE64 em falta - APK sem assinatura, sem release"
            echo "SIGNED=false" >> "$GITHUB_ENV"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/homecartoon.p12"
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/homecartoon.p12" >> "$GITHUB_ENV"
          fi
      - name: Assemble release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: homecartoon
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Collect APK
        run: |
          apk=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          test -n "$apk"
          cp "$apk" home-cartoon-tv.apk
          ls -la home-cartoon-tv.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: home-cartoon-tv
          path: home-cartoon-tv.apk
      - name: Publish GitHub release
        if: env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$JELLYFIN_VERSION" home-cartoon-tv.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Home Cartoon $JELLYFIN_VERSION" \
            --notes "Instalar no Chromecast com Google TV: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/home-cartoon-tv.apk" \
            --latest
